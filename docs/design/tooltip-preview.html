<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Recordum — anteprima ToolTip</title>
<style>
  :root{ --font:"Palatino Linotype","Book Antiqua",Georgia,serif; }
  .light{ --bg:#FFFFFF; --elevated:#FFFFFF; --border:#E4E4E7; --text:#18181B; }
  .dark { --bg:#18181B; --elevated:#27272A; --border:#3F3F46; --text:#FAFAFA; }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:#0b0b0d;color:#e4e4e7;
       display:flex;gap:46px;flex-wrap:wrap;justify-content:center;padding:60px 24px}
  .stage{display:flex;flex-direction:column;gap:18px;align-items:center}
  .stage h2{font:600 13px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:#9ca3af;margin:0}
  .canvas{width:300px;height:150px;background:var(--bg);border:1px solid var(--border);border-radius:14px;
          display:flex;align-items:center;justify-content:center;position:relative}
  /* after: rounded + soft shadow */
  .tip{background:var(--elevated);border:1px solid var(--border);border-radius:6px;
       padding:6px 9px;color:var(--text);font-size:12px;box-shadow:0 2px 12px rgba(0,0,0,.16)}
  /* before: square Aero box */
  .old{background:#f9f9f9;border:1px solid #767676;padding:4px 6px;color:#111;
       font:12px "Segoe UI",sans-serif;box-shadow:1px 1px 2px rgba(0,0,0,.2)}
  .note{max-width:300px;font:400 13px/1.55 system-ui;color:#9ca3af;text-align:center}
</style>
</head>
<body>
  <div class="stage light"><h2>Dopo — Light</h2>
    <div class="canvas"><span class="tip">Mostra/nascondi la barra laterale</span></div></div>
  <div class="stage dark"><h2>Dopo — Dark</h2>
    <div class="canvas"><span class="tip">Crea un backup cifrato (.recbak)</span></div></div>
  <div class="stage"><h2>Prima</h2>
    <div class="canvas" style="--bg:#deded6;--border:#b8b8b8">
      <span class="old">Mostra/nascondi la barra laterale</span></div>
    <p class="note">Prima: rettangolo squadrato col bordo grigio scuro. Ora: angoli arrotondati (6px),
       bordo tema 1px e un'ombra morbida — stessa famiglia di menù e dropdown.</p></div>
</body>
</html>
