name: CI

# Due job: Linux esegue le suite portabili, Windows tutto (WPF, DPAPI, ChartEngine compresi).
# I push di sola documentazione non consumano minuti: l'autore pusha a ogni .md.
on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # UseAppHost resta quello di Directory.Build.props: da riga di comando romperebbe Recordum.UI.Tests (xunit v3).
      - name: Build
        run: dotnet build Recordum.slnx -p:EnableWindowsTargeting=true
      - name: Test
        run: |
          rc=0
          for p in Core Presentation UI Plugins Plugins.ExportEngine; do
            dotnet test "tests/Recordum.$p.Tests" --no-build --logger "trx;LogFileName=$p.trx" --results-directory TestResults || rc=1
          done
          # DPAPI esiste solo su Windows: quelle classi portano il tratto WindowsOnly.
          dotnet test tests/Recordum.Data.Tests --no-build --filter "Category!=WindowsOnly" \
            --logger "trx;LogFileName=Data.trx" --results-directory TestResults || rc=1
          exit $rc
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: tests/Recordum.UI.Tests/bin/**/Screenshots/*.png
          if-no-files-found: ignore
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trx-linux
          path: TestResults/*.trx

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Recordum.slnx
      - name: Test
        shell: pwsh
        run: |
          $rc = 0
          foreach ($p in 'Core', 'Data', 'Presentation', 'UI', 'Plugins', 'Plugins.ExportEngine', 'Plugins.ChartEngine') {
            dotnet test "tests/Recordum.$p.Tests" --no-build --logger "trx;LogFileName=$p.trx" --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { $rc = 1 }
          }
          exit $rc
      # Serializzata: in parallelo la suite WPF può appendersi a zero fallimenti (W24-E1).
      - name: Test WPF
        if: always()
        timeout-minutes: 25
        shell: pwsh
        run: >
          dotnet test tests/Recordum.WPF.Tests --no-build --blame-hang-timeout 10m
          --logger "trx;LogFileName=WPF.trx" --results-directory TestResults
          -- xUnit.ParallelizeTestCollections=false
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: tests/Recordum.UI.Tests/bin/**/Screenshots/*.png
          if-no-files-found: ignore
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trx-windows
          path: TestResults/**
