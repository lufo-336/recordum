<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recordum Editor</title>
  <link rel="stylesheet" href="toast-ui-editor.min.css">
  <style>
    /* App theme palette. Defaults to the dark theme so the editor never flashes white before
       the host's setTheme message arrives; the host overrides these live (also handles light). */
    :root{
      --rec-bg:#18181B; --rec-text:#FAFAFA; --rec-muted:#A1A1AA;
      --rec-border:#3F3F46; --rec-accent:#60A5FA; --rec-elev:#27272A;
      --rec-icon-invert:0.7;   /* dark glyph sprites -> light in dark mode; ~0 in light mode */
      /* Diary surface in Palatino — mirrors Tokens.xaml Font.Default. WebView2 is Windows
         ("Palatino Linotype"); Palatino + serif keep the macOS browser preview faithful. */
      --rec-font:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    }
    html, body { margin:0; padding:0; height:100%; background:var(--rec-bg);
                 font-family:var(--rec-font); }
    #editor { height:100%; }

    /* --- container / chrome: flat, borderless, theme bg --- */
    .toastui-editor-defaultUI{ border:0 !important; background:var(--rec-bg) !important; }
    .toastui-editor-defaultUI .toastui-editor-toolbar,
    .toastui-editor-defaultUI-toolbar{ background:var(--rec-bg) !important; border:0 !important;
        border-bottom:1px solid var(--rec-border) !important; }
    .toastui-editor-toolbar-group{ background:transparent !important; }
    .toastui-editor-toolbar-divider{ background-color:var(--rec-border) !important; }
    .toastui-editor-defaultUI-toolbar button,
    .toastui-editor-toolbar-icons{ border:0 !important; background-color:transparent !important;
        filter:invert(var(--rec-icon-invert)); border-radius:5px; }
    .toastui-editor-defaultUI-toolbar button:hover,
    .toastui-editor-toolbar-icons:hover{ background-color:var(--rec-elev) !important; filter:invert(var(--rec-icon-invert)); }

    /* --- editing surface --- */
    .toastui-editor-main,
    .toastui-editor-md-container, .toastui-editor-ww-container,
    .toastui-editor-md-mode .toastui-editor-md-container,
    .toastui-editor-defaultUI .ProseMirror{ background:var(--rec-bg) !important; color:var(--rec-text) !important; }
    .toastui-editor-contents{ color:var(--rec-text) !important; font-family:var(--rec-font) !important; }
    .toastui-editor-contents *{ border-color:var(--rec-border) !important; }
    .toastui-editor-contents p, .toastui-editor-contents li,
    .toastui-editor-contents h1, .toastui-editor-contents h2, .toastui-editor-contents h3,
    .toastui-editor-contents h4, .toastui-editor-contents h5, .toastui-editor-contents h6,
    .toastui-editor-contents strong, .toastui-editor-contents em{ color:var(--rec-text) !important; }
    .toastui-editor-contents h1, .toastui-editor-contents h2{ border-bottom-color:var(--rec-border) !important; }
    .ProseMirror{ caret-color:var(--rec-accent) !important; }
    .toastui-editor-contents a{ color:var(--rec-accent) !important; }
    .toastui-editor-contents blockquote{ border-left-color:var(--rec-border) !important; color:var(--rec-muted) !important; }
    .toastui-editor-contents code,
    .toastui-editor-contents pre{ background:var(--rec-elev) !important; color:var(--rec-text) !important; }
    .toastui-editor-contents-placeholder,
    .ProseMirror .placeholder{ color:var(--rec-muted) !important; }

    /* --- markdown source mode (split editor) --- */
    .toastui-editor-md-preview{ background:var(--rec-bg) !important; }
    .toastui-editor-md-splitter{ background:var(--rec-border) !important; }
    .CodeMirror, .toastui-editor .CodeMirror{ background:var(--rec-bg) !important; color:var(--rec-text) !important; }

    /* --- bottom mode switch tabs (Markdown | WYSIWYG) --- */
    .toastui-editor-mode-switch{ background:var(--rec-bg) !important; border-top:1px solid var(--rec-border) !important; }
    .toastui-editor-mode-switch .tab-item{ background:var(--rec-bg) !important; color:var(--rec-muted) !important;
        border-color:var(--rec-border) !important; }
    .toastui-editor-mode-switch .tab-item.active{ color:var(--rec-text) !important; background:var(--rec-elev) !important; }

    /* --- tab-style preview header (previewStyle: tab) --- */
    .toastui-editor-tabs .tab-item{ background:var(--rec-bg) !important; color:var(--rec-muted) !important; border-color:var(--rec-border) !important; }
    .toastui-editor-tabs .tab-item.active{ color:var(--rec-text) !important; }

    /* --- popups (link/table/heading dropdowns) --- */
    .toastui-editor-popup, .toastui-editor-popup-body,
    .toastui-editor-dropdown-toolbar, .toastui-editor-context-menu{
        background:var(--rec-elev) !important; color:var(--rec-text) !important; border-color:var(--rec-border) !important; }
    .toastui-editor-popup input[type=text]{ background:var(--rec-bg) !important; color:var(--rec-text) !important;
        border:1px solid var(--rec-border) !important; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="toast-ui-editor.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
